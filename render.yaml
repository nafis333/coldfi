services:
  - type: web
    name: coldfi-backend
    runtime: docker
    repo: https://github.com/YOUR_USERNAME/coldfi
    branch: main
    dockerfilePath: packages/backend/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://coldfi.vercel.app
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: PBKDF2_ITERATIONS
        value: 600000
      - key: MAX_LOGIN_ATTEMPTS
        value: 5
      - key: LOGIN_WINDOW_MINUTES
        value: 15
      - key: REMINDER_POLL_INTERVAL
        value: '300000'
      - key: SERVER_ENCRYPTION_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
    healthCheckPath: /health/live
    autoDeploy: true
