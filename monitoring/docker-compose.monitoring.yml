version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ft-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - monitoring
      - coldfi-backend

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ft-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-coldfi}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - monitoring
      - coldfi-backend

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: ft-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "9121:9121"
    networks:
      - monitoring
      - coldfi-backend

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: ft-nginx-exporter
    restart: unless-stopped
    environment:
      NGINX_HOST: nginx
      NGINX_PORT: 80
      SCRAPE_URI: http://nginx:80/nginx_status
    ports:
      - "9113:9113"
    networks:
      - monitoring
      - coldfi-backend

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ft-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    name: ft-monitoring
  coldfi-backend:
    external: true
    name: coldfi-backend
