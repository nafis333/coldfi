name: Keep Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Backend
    runs-on: ubuntu-latest
    steps:
      - name: Keep backend alive
        run: |
          curl -sf --max-time 10 "${{ secrets.BACKEND_URL }}/health/live" \
            && echo "Backend is awake" \
            || echo "Backend unreachable"
